name: Run Migration and Recompute Waterfall

on:
  workflow_dispatch:

jobs:
  migrate-and-recompute:
    runs-on: ubuntu-latest
    environment: Agent  # Use Agent environment for secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase pyyaml python-dateutil psycopg2-binary

      - name: Print migration SQL
        run: |
          echo "============================================================"
          echo "Migration 011 needs to be applied in Supabase SQL Editor:"
          echo "============================================================"
          cat scripts/migrations/011_add_waterfall_beginning_ending.sql
          echo ""
          echo "============================================================"
          echo "After applying, the waterfall computation will populate these columns."
          echo "For now, continuing with computation (will fail if columns don't exist)"
          echo "============================================================"

      - name: Delete old waterfall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))
          # Find latest snapshot date
          latest = sb.table('deals_snapshot').select('snapshot_date').order('snapshot_date', desc=True).limit(1).execute().data
          if latest:
              latest_date = latest[0]['snapshot_date']
              sb.table('waterfall_weekly').delete().eq('week_ending', latest_date).execute()
              print(f'✓ Deleted old waterfall for {latest_date}')
          else:
              print('⚠️  No snapshots found')
          "

      - name: Recompute waterfall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/compute_waterfall.py

      - name: Diagnose mismatches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/diagnose_waterfall_mismatch.py

      - name: Show results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          from datetime import datetime
          sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))

          # Find latest waterfall date
          latest = sb.table('waterfall_weekly').select('week_ending').order('week_ending', desc=True).limit(1).execute().data
          if not latest:
              print('⚠️  No waterfall data found')
              exit(0)

          latest_date = latest[0]['week_ending']
          result = sb.table('waterfall_weekly').select('*').eq('week_ending', latest_date).execute()

          print(f'\n=== Waterfall Results (Week Ending {latest_date}) ===')
          for row in result.data:
              begin = row.get('beginning_value', 0) or 0
              end = row.get('ending_value', 0) or 0
              new = row.get('new_pipeline_value', 0) or 0
              fwd = row.get('moved_forward_value', 0) or 0
              back = row.get('moved_backward_value', 0) or 0
              won = row.get('won_value', 0) or 0
              lost = row.get('lost_value', 0) or 0
              net = row.get('net_change', 0) or 0

              print(f\"\nPipeline: {row['pipeline_id']}\")
              print(f\"  Beginning:     \${begin:>12,.0f}\")
              print(f\"  + New:         \${new:>12,.0f}\")
              print(f\"  + Fwd:         \${fwd:>12,.0f}\")
              print(f\"  - Back:        \${back:>12,.0f}\")
              print(f\"  - Won:         \${won:>12,.0f}\")
              print(f\"  - Lost:        \${lost:>12,.0f}\")
              print(f\"  = Net Change:  \${net:>12,.0f}\")
              print(f\"  = Ending:      \${end:>12,.0f}\")

              # Validation
              calc_end = begin + new + fwd - back - won - lost
              if abs(calc_end - end) < 1:
                  print(f\"  ✓ Waterfall validates\")
              else:
                  print(f\"  ✗ Mismatch: calc={calc_end:.0f}, actual={end:.0f}\")
          "
