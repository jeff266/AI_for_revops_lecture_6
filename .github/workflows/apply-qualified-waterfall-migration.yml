name: Apply Qualified Waterfall Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: Agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Apply migration 013
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -c "
import os
from supabase import create_client
from pathlib import Path

sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))
migration_sql = Path('scripts/migrations/013_add_newly_qualified_to_waterfall.sql').read_text()

print('Applying migration 013: Add newly_qualified_value to waterfall_weekly')
for statement in migration_sql.split(';'):
    statement = statement.strip()
    if statement:
        try:
            sb.rpc('exec_sql', {'sql': statement}).execute()
            print(f'✓ Executed: {statement[:80]}...')
        except Exception as e:
            if 'already exists' in str(e) or 'duplicate column' in str(e).lower():
                print(f'⚠️  Column already exists (OK): {e}')
            else:
                raise
print('')
print('✅ Migration complete')
print('')
print('Now run: Rebuild Waterfall and Verify workflow')
"

      - name: Rebuild waterfall with qualified filter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install pyyaml python-dateutil
          python scripts/analytics/compute_waterfall.py
