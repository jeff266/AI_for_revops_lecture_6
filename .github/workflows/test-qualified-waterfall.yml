name: Test Qualified Waterfall

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment: Agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run migration to add newly_qualified_value column
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install supabase
          python -c "
import os
from supabase import create_client
from pathlib import Path

sb = create_client(os.getenv('SUPABASE_URL'), os.getenv('SUPABASE_SERVICE_KEY'))
migration_sql = Path('scripts/migrations/013_add_newly_qualified_to_waterfall.sql').read_text()

for statement in migration_sql.split(';'):
    statement = statement.strip()
    if statement:
        try:
            sb.rpc('exec_sql', {'sql': statement}).execute()
            print(f'✓ Executed: {statement[:50]}...')
        except Exception as e:
            print(f'Note: {e}')
print('✓ Migration complete')
"

      - name: Compute qualified waterfall
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/analytics/compute_waterfall.py
