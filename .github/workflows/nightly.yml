name: MEDDICC Agent Nightly Run

on:
  schedule:
    # Run at 2am UTC daily
    - cron: '0 2 * * *'

  workflow_dispatch:  # Allow manual triggers
    inputs:
      test_mode:
        description: 'Test mode (limits to 5 deals)'
        required: false
        default: 'false'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
  APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
  HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPO: ${{ github.repository }}

jobs:
  run-meddicc-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests PyGithub

      - name: Run MEDDICC agent
        id: run_agent
        run: |
          cd scripts
          python run_nightly.py
        continue-on-error: true

      - name: Check for errors
        if: steps.run_agent.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_title = `MEDDICC Agent Failed - ${new Date().toISOString().split('T')[0]}`;
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue_body = `The nightly MEDDICC agent run failed.

            **Workflow Run**: ${workflowUrl}
            **Time**: ${new Date().toISOString()}

            Please check the workflow logs for details.

            cc: @jeffignacio`;

            // Check if issue already exists for today
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'meddicc-agent-error',
              per_page: 10
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.find(issue => issue.title.includes(today));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ['meddicc-agent-error', 'automated']
              });
            }

      - name: Upload learning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meddicc-learnings-${{ github.run_number }}
          path: |
            memory/learnings/*.json
            memory/diffs/*.md
          retention-days: 90

      - name: Commit memory updates
        if: steps.run_agent.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add memory/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update MEDDICC agent memory [skip ci]"
          git push
