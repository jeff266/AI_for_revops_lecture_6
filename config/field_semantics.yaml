# Field semantics — the single source of truth for what fields MEAN.
# Client-specific. Template deployments override this file; no code changes.
#
# GENERATED BY: python scripts/discover_stages.py
# This file maps HubSpot stage IDs to semantic meaning (buckets and transitions).
#
# stage_map: HubSpot stage IDs → canonical meaning + pipeline bucket.
#   The bucket (discovery|scoping|proposal|closed_won|closed_lost) is what
#   handlers reason about. The stage_id is what lives in deals.stage.
#
# This complements stage_id_mapping.yaml:
#   - field_semantics.yaml: CURRENT active stages
#   - stage_id_mapping.yaml: HISTORICAL deleted/retired stages
#
# Both are needed for historical waterfall reconstruction.

stage_map:
  # Run scripts/discover_stages.py to populate this map from your HubSpot instance
  # Example format:
  # appointmentscheduled:
  #   label: "Discovery"
  #   bucket: "discovery"
  #   transition: "discovery_to_scoping"

outcome_buckets:
  won: ["closed_won"]
  lost: ["closed_lost"]

field_units:
  # Field name → unit type for proper formatting
  # Add custom fields here as needed
  amount: "currency"
  incremental_arr: "currency"
  closedate: "date"

retired_stages:
  # Hard-deleted stage IDs that appear only in property history.
  # Acknowledged but deliberately NOT classified.
  # Format: {"old_stage_id": "reason for retirement"}
  # Example:
  # "12345678": "Merged into Discovery stage in 2024"
