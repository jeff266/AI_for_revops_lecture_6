organization:
  name: YOUR_ORGANIZATION_NAME
  crm: HubSpot
  sales_methodology: MEDDICC
  timezone: America/New_York
  internal_domains:
  - YOUR_COMPANY_DOMAIN.com
fiscal:
  fy_start_month: 1
segmentation:
  source: company
  field: numberofemployees
  bands:
  - name: SMB
    max: 500
    expected_cycle_days: 30
  - name: Mid-Market
    min: 501
    max: 2500
    expected_cycle_days: 60
  - name: Enterprise
    min: 2501
    expected_cycle_days: 90
  - name: Unknown
    expected_cycle_days: null
pipeline:
  value_field: amount
  lost_reason_field: closed_lost_reason
  pipelines:
  - id: default
    name: Sales Pipeline
    is_primary: true
    stages:
    - id: appointmentscheduled
      name: Meeting Set
      order: 1
      exclude_from_analysis: true
    - id: qualifiedtobuy
      name: Discovery
      order: 2
    - id: presentationscheduled
      name: Scoping
      order: 3
    - id: decisionmakerboughtin
      name: Evaluation
      order: 4
    - id: contractsent
      name: Proposal
      order: 5
    - id: closedwon
      name: Closed Won
      order: 6
      is_won: true
    - id: closedlost
      name: Closed Lost
      order: 6
      is_lost: true
    qualified_stage_order: 3
stage_progression:
  discovery_to_scoping:
    identified_pain: 5
    champion: 4
    minimum_stakeholders: 2
  scoping_to_proposal:
    metrics: 6
    economic_buyer: 6
    champion: 6
    decision_criteria: 5
  proposal_to_negotiating:
    all_components_minimum: 6
    decision_process: 7
    competition: 6
  negotiating_to_closed_won:
    all_components_minimum: 8
    decision_process: 7
quality_thresholds:
  evaluation_mode: strict
  minimum_quality_score: 70
  evidence:
    minimum_quotes_for_high_score: 2
    maximum_hedging_words: 2
  score_ranges:
    strong_identified:
      min: 9
      max: 10
    identified:
      min: 7
      max: 8
    partial:
      min: 5
      max: 6
    weak:
      min: 3
      max: 4
    unknown:
      min: 1
      max: 2
deal_health:
  strong:
    minimum_components_above_6: 5
    minimum_champion_score: 5
  at_risk:
    critical_components_below_5:
    - champion
    - economic_buyer
    components_below_5_count: 3
    champion_score_below: 5
models:
  context_builder:
    name: claude-haiku-4-5-20251001
    base_tokens: 2000
    tokens_per_call: 500
    max_tokens_cap: 16000
  generator:
    name: claude-sonnet-4-5-20250929
    max_tokens: 8000
  evaluator:
    name: claude-sonnet-4-5-20250929
    max_tokens: 4000
call_tools:
  primary: fireflies
etl:
  deal_properties:
  - dealname
  - dealstage
  - pipeline
  - closedate
  - amount
  - incremental_arr
  - hubspot_owner_id
  - createdate
  - hs_lastmodifieddate
  active_deals_refresh: nightly
  call_lookback_days: 90
sales_methodology: MEDDICC
