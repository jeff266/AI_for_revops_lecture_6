# Client Configuration
# This file contains organization-specific settings for the MEDDICC analysis system.
# Students should update these values to match their organization's HubSpot setup.

# ============================================================================
# ORGANIZATION INFO
# ============================================================================
organization:
  name: "YOUR_COMPANY_NAME"
  crm: "HubSpot"
  sales_methodology: "MEDDICC"  # Options: MEDDICC, MEDDPICC, MEDDIC
  timezone: "America/Los_Angeles"  # Used for meddicc_last_analyzed date field
  internal_domains:
    - "your-company.com"

fiscal:
  fy_start_month: 2  # FY starts Feb 1; Q2 FY2027 = May 1 - Jul 31 2026

# ============================================================================
# HUBSPOT PIPELINE CONFIGURATION
# ============================================================================
# Use scripts/discover_stages.py to find your organization's stage IDs

# ============================================================================
# PHASE A: New pipeline configuration shape (for analytics layer)
# ============================================================================
# This new shape enables waterfall tracking, conversion analysis, and
# qualification trending. The legacy excluded_stages block below is kept
# for backward compatibility during transition.

pipeline:
  # Analytics configuration
  # value_field: amount  # Default: uses HubSpot 'amount' property
  # For computed ARR from multiple properties, uncomment and configure:
  # value_field:
  #   type: computed
  #   components: ["new_revenue", "expansion_revenue"]
  #   # NULL-safe sum: blank components treated as 0
  qualified_stage_order: 1  # Stages with order >= this are "qualified" (entered pipeline)
  win_rate_qualified_field: "sao"  # Win rate denominator = deals where SAO is true

  # Pipeline definitions with per-stage configuration
  pipelines:
    - id: "default"
      name: "Sales Pipeline"
      stages:
        # RULE: Disqualified stages get BOTH is_lost=true AND exclude_from_analysis=true
        # Lost stages (is_lost=true) are included in waterfall unless exclude_from_analysis=true

        - id: "79653122"
          name: "Meeting Set"
          order: 0
          stage_probability: 0.05
          exclude_from_analysis: true  # Too early - not qualified yet

        - id: "appointmentscheduled"
          name: "Discovery"
          order: 1
          stage_probability: 0.10
          qualified_stage_order: 1  # First qualified stage

        - id: "qualifiedtobuy"
          name: "Scoping"
          order: 2
          stage_probability: 0.10

        - id: "presentationscheduled"
          name: "Technical Evaluation"
          order: 3
          stage_probability: 0.40

        - id: "24682892"
          name: "Negotiating"
          order: 4
          stage_probability: 0.60

        - id: "43449439"
          name: "Awaiting Signature"
          order: 5
          stage_probability: 0.90

        - id: "closedwon"
          name: "Closed Won (default)"
          order: 6
          stage_probability: 1.0
          is_won: true

        - id: "closedlost"
          name: "Closed Lost (default)"
          order: 7
          stage_probability: 0.0
          is_lost: true

        - id: "decisionmakerboughtin"
          name: "Review"
          order: 8
          stage_probability: 0.50

        - id: "68509551"
          name: "Disqualified"
          order: 9
          stage_probability: 0.0
          is_lost: true
          exclude_from_analysis: true  # Both flags: lost AND excluded

    - id: "866608541"
      name: "Renewal Pipeline"
      analyze: false  # MEDDICC agent skips; analytics INCLUDES for GRR/NRR
      qualified_stage_order: 0
      stages:
        - id: "1297321618"
          name: "Upcoming Renewal"
          order: 0
          stage_probability: 0.75

        - id: "1297321619"
          name: "Renewal Engaged"
          order: 1
          stage_probability: 0.85

        - id: "1297321620"
          name: "Pricing Presented"
          order: 2
          stage_probability: 0.90

        - id: "1297321622"
          name: "Contract Sent"
          order: 3
          stage_probability: 0.95

        - id: "1297321623"
          name: "Closed Won (Renewal)"
          order: 4
          stage_probability: 1.0
          is_won: true

        - id: "1297321624"
          name: "Closed Lost (Renewal)"
          order: 5
          stage_probability: 0.0
          is_lost: true

# ============================================================================
# LEGACY: Backward-compatible excluded_stages configuration
# ============================================================================
# This block is kept for backward compatibility during Phase A transition.
# The new pipeline.pipelines[] shape above takes precedence when both exist.

pipelines:
  # Pipelines to include in active deal analysis
  # Only deals in these pipelines will be analyzed nightly
  included:
    - name: "Sales Pipeline"
      id: "default"

  # Pipelines to exclude from active deal analysis
  # Common: renewal pipelines, partner pipelines, marketing pipelines
  excluded:
    - name: "Renewal"
      id: "866608541"

# ============================================================================
# DEAL STAGE FILTERING
# ============================================================================
# Stages to exclude from active deal analysis
# Common exclusions: too early (meeting set), too late (closed), or disqualified

excluded_stages:
  # Early stages (pre-discovery)
  meeting_set:
    - name: "Meeting Set"
      id: "79653122"
    # NOTE: appointmentscheduled is "Discovery" stage, NOT Meeting Set - do not exclude

  # Disqualified deals
  disqualified:
    - name: "Disqualified"
      id: "68509551"

  # Closed deals (excluded in active mode, included in history mode)
  closed_won:
    - name: "Closed won"
      id: "closedwon"
    - name: "Closed Won"
      id: "1297321623"

  closed_lost:
    - name: "Closed lost"
      id: "closedlost"
    - name: "Closed Lost"
      id: "1297321624"

# ============================================================================
# STAGE PROGRESSION REQUIREMENTS
# ============================================================================
# Minimum MEDDICC component scores required to advance between stages
# Used by evaluator to validate stage recommendations

stage_progression:
  discovery_to_scoping:
    identified_pain: 5
    champion: 4
    minimum_stakeholders: 2

  scoping_to_proposal:
    metrics: 6
    economic_buyer: 6
    champion: 6
    decision_criteria: 5

  proposal_to_negotiating:
    # All components must meet minimum
    all_components_minimum: 6
    decision_process: 7
    competition: 6

  negotiating_to_closed_won:
    # All components must be strong
    all_components_minimum: 8
    decision_process: 7
    # If using MEDDPICC:
    # paper_process: 7

# ============================================================================
# ANALYSIS QUALITY THRESHOLDS
# ============================================================================
# Evaluator pass/fail criteria
# Based on deliverable/rubrics/evaluator-pass-fail-criteria.md

quality_thresholds:
  # Evaluation mode
  # strict: Reject if ANY criterion fails (recommended for initial rollout)
  # standard: Reject if 2+ criteria fail (after 30+ approved analyses)
  # lenient: Reject if 3+ criteria fail (not recommended)
  evaluation_mode: "strict"

  # Minimum quality score to approve (0-100)
  # Calculated from 7 criteria, each weighted
  minimum_quality_score: 70

  # Evidence requirements
  evidence:
    minimum_quotes_for_high_score: 2  # Scores 8+ need 2+ quotes
    maximum_hedging_words: 2  # Max uses of "seems", "appears", "probably"

  # Score justification ranges
  score_ranges:
    strong_identified:  # 9-10: Crystal clear, multiple confirmations
      min: 9
      max: 10
    identified:  # 7-8: Clear evidence, single confirmation
      min: 7
      max: 8
    partial:  # 5-6: Partial info, needs clarification
      min: 5
      max: 6
    weak:  # 3-4: Vague mention, significant gaps
      min: 3
      max: 4
    unknown:  # 1-2: Not discussed or unknown
      min: 1
      max: 2

# ============================================================================
# DEAL HEALTH CALCULATION
# ============================================================================
# Rules for determining overall deal health status

deal_health:
  strong:
    minimum_components_above_6: 5  # Need 5+ components scoring 6+
    minimum_champion_score: 5

  at_risk:
    # Deal is at risk if ANY of these conditions are true
    critical_components_below_5: ["champion", "economic_buyer"]
    components_below_5_count: 3  # 3+ components below 5
    champion_score_below: 5

# ============================================================================
# TOKEN BUDGET & MODEL SELECTION
# ============================================================================
# Control costs and performance

models:
  context_builder:
    name: "claude-haiku-4-5-20251001"
    base_tokens: 2000
    tokens_per_call: 500  # Additional tokens per historical call
    max_tokens_cap: 16000

  generator:
    name: "claude-sonnet-4-5-20250929"
    max_tokens: 8000

  evaluator:
    name: "claude-sonnet-4-5-20250929"
    max_tokens: 4000

# ============================================================================
# CALL INTELLIGENCE PLATFORM
# ============================================================================
# Configure which call recording platform to use for transcript extraction
# Supported: fireflies, gong

call_tools:
  # Primary call intelligence platform
  # Options: 'fireflies' (Fireflies.ai) or 'gong' (Gong.io)
  primary: "fireflies"

# ============================================================================
# ETL CONFIGURATION
# ============================================================================
# Settings for nightly deal and call ingestion

etl:
  # Deal properties to fetch from HubSpot
  # Add custom properties your organization uses
  deal_properties:
    - dealname
    - dealstage
    - pipeline
    - closedate
    - amount
    - incremental_arr
    - hubspot_owner_id
    - createdate
    - hs_lastmodifieddate
    # Add your custom properties here:
    # - custom_priority_score
    # - industry_vertical

  # Refresh frequency
  active_deals_refresh: "nightly"  # How often to refresh active deal list
  call_lookback_days: 90  # How far back to look for calls

# ============================================================================
# CUSTOMIZATION NOTES
# ============================================================================
#
# To customize this for your organization:
#
# 1. Run scripts/discover_stages.py to get your HubSpot stage IDs
# 2. Update pipelines.excluded with your renewal/partner pipelines
# 3. Update excluded_stages with your organization's stage names and IDs
# 4. Adjust stage_progression thresholds based on your sales process
# 5. Set evaluation_mode to "strict" for initial rollout
# 6. Add custom deal_properties you want to include in analysis
#
# See README.md for detailed setup instructions.
